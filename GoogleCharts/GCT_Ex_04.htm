<!--

Google Chart

Column Chart Example - Multiple Series with Legend

Autor: P. Dias

Data: July 2018

-->

<html>

<head>

    <!-- Load the AJAX API-->
    <meta charset="utf-8" />
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">

        // Load the Visualization API and the corechart package.
        google.charts.load('current', {'packages': ['corechart']});

        // Set a callback to run when the Google Visualization API is loaded.
        google.charts.setOnLoadCallback(drawChart);

        // Callback that creates and populates a data table,
        // instantiates the column chart, passes in the data and
        // draws it.

        function drawChart() {

            // Create the data table.
            var data = new google.visualization.DataTable();

            // First column
            data.addColumn('string', 'Year');

            // Remaining columns - one per course
            data.addColumn('number', 'MIEET');
            data.addColumn('number', 'MIECT');
            data.addColumn('number', 'LTSI');
            data.addColumn('number', 'LEI');

            data.addRows([
                ['2007', 328, 589, 115, 0],
                ['2008', 361, 605, 223, 0],
                ['2009', 400, 365, 152, 0],
                ['2010', 360, 357, 129, 0],
                ['2011', 325, 316, 96, 0],
                ['2012', 394, 344, 93, 0],
                ['2013', 404, 294, 102, 0],
                ['2014', 271, 307, 0, 501],
                ['2015', 402, 291, 0, 843],
                ['2016', 367, 337, 0, 802],
                ['2017', 407, 399, 0, 691]
            ]);

            // Set chart configuration options - column chart
            var columnOptions = {
                title: 'DETI - Number of candidates by course (2007-2017)',
                width: 900,
                height: 600,
                legend: { position: 'top' },
                vAxis: {
                    minValue: 0
                }
            };

            // Instantiate the column chart.
            var columnChart = new google.visualization.ColumnChart(document.getElementById('chart_div'));

            // Draw the column chart.
            columnChart.draw(data, columnOptions);

            // Set chart configuration options - line chart
            var lineOptions = {
                title: 'DETI - Evolution of the number of candidates by course (2007-2017)',
                width: 900,
                height: 600,
                legend: { position: 'top' },
                vAxis: {
                    minValue: 0
                }
            };

            // Instantiate the line chart.
            var lineChart = new google.visualization.LineChart(document.getElementById('line_chart_div'));

            // Draw the line chart.
            lineChart.draw(data, lineOptions);

        } // drawChart( )

    </script>
</head>

<body>
    <!--Div that will hold the column chart-->
    <div id="chart_div" style="width:900px; height:600px"></div>

    <!--Div that will hold the line chart-->
    <div id="line_chart_div" style="width:900px; height:600px"></div>

    <!--
    Line chart better for evolution over time per course (trend clear per line).
    Column chart better for comparing courses within same year (bars side by side, easy magnitude compare).
    -->
</body>

</html>
