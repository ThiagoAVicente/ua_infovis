<!--

Google Chart

Combo Chart Example - Column series + Line total

Autor: P. Dias

Data: July 2018

-->

<html>

<head>

    <!-- Load the AJAX API-->
    <meta charset="utf-8" />
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">

        // Load the Visualization API and the corechart package.
        google.charts.load('current', {'packages': ['corechart']});

        // Set a callback to run when the Google Visualization API is loaded.
        google.charts.setOnLoadCallback(drawChart);

        // Callback that creates and populates a data table,
        // instantiates the combo chart, passes in the data and
        // draws it.

        function drawChart() {

            // Create the data table.
            var data = new google.visualization.DataTable();

            // First column
            data.addColumn('string', 'Year');

            // Remaining columns - one per course + total
            data.addColumn('number', 'MIEET');
            data.addColumn('number', 'MIECT');
            data.addColumn('number', 'LTSI');
            data.addColumn('number', 'LEI');
            data.addColumn('number', 'Total');

            data.addRows([
                ['2007', 328, 589, 115, 0, 831],
                ['2008', 361, 605, 223, 0, 972],
                ['2009', 400, 365, 152, 0, 755],
                ['2010', 360, 357, 129, 0, 678],
                ['2011', 325, 316, 96, 0, 581],
                ['2012', 394, 344, 93, 0, 653],
                ['2013', 404, 294, 102, 0, 622],
                ['2014', 271, 307, 0, 501, 780],
                ['2015', 402, 291, 0, 843, 1164],
                ['2016', 367, 337, 0, 802, 1175],
                ['2017', 407, 399, 0, 691, 1147]
            ]);

            // Set chart configuration options
            var options = {
                title: 'UA - DETI candidates by course',
                width: 900,
                height: 600,
                vAxis: {
                    title: 'Student number',
                    minValue: 0
                },
                seriesType: 'bars',
                series: {
                    4: {type: 'line'}
                }
            };

            // Instantiate the combo chart.
            var chart = new google.visualization.ComboChart(document.getElementById('chart_div'));

            // Draw the chart, passing in some configuration options.
            chart.draw(data, options);

        } // drawChart( )

    </script>
</head>

<body>
    <!--Div that will hold the combo chart-->
    <div id="chart_div" style="width:900px; height:600px"></div>
</body>

</html>
